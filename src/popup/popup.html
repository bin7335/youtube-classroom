<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>클래스룸 for YouTube</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="brand">
      <img src="../../icons/icon48.png" alt="" width="22" height="22">
      <span>클래스룸 <small>for YouTube</small></span>
    </div>
    <label class="master" title="Alt+Q">
      <span id="masterState">수업 모드</span>
      <input type="checkbox" id="enabled" class="switch">
    </label>
  </header>

  <main id="options">
    <section>
      <h2>가리기</h2>
      <div class="chips" id="hideList"></div>
    </section>
    <section>
      <h2>재생</h2>
      <div class="chips">
        <label class="chip"><input type="checkbox" id="autoplayOff"><span>자동재생 끄기</span></label>
        <label class="chip"><input type="checkbox" id="blackScreen"><span>끝나면 검은 화면</span></label>
      </div>
    </section>
  </main>

  <section class="seg" id="segGroup" hidden>
    <h2>구간</h2>
    <div class="seg-row">
      <div class="field">
        <input id="segStart" placeholder="시작" inputmode="numeric" aria-label="시작 시간">
        <button type="button" class="now" id="segNowStart" title="현재 위치">⏱</button>
      </div>
      <span class="dash">–</span>
      <div class="field">
        <input id="segEnd" placeholder="끝" inputmode="numeric" aria-label="끝 시간">
        <button type="button" class="now" id="segNowEnd" title="현재 위치">⏱</button>
      </div>
    </div>
    <div class="seg-actions">
      <label class="chip small"><input type="checkbox" id="segLoop"><span>🔁 반복</span></label>
      <span class="spacer"></span>
      <button type="button" class="ghost" id="segClear">지우기</button>
      <button type="button" class="primary" id="segSave">저장</button>
    </div>
    <p class="msg" id="segMsg"></p>
  </section>

  <footer class="foot">
    <span><kbd>Alt</kbd><kbd>Q</kbd></span>
    <span id="version"></span>
  </footer>

  <script src="../shared/settings.js"></script>
  <script src="../shared/store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
